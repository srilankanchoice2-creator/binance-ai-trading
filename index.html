
<script>
const API="https://fapi.binance.com";

function ema(v,p){
  let k=2/(p+1),r=v[0],out=[r];
  for(let i=1;i<v.length;i++){
    r=v[i]*k+r*(1-k);
    out.push(r);
  }
  return out;
}

function rsi(v,p=14){
  let g=0,l=0;
  for(let i=1;i<=p;i++){
    let d=v[i]-v[i-1];
    if(d>0)g+=d;else l-=d;
  }
  let ag=g/p,al=l/p;
  for(let i=p+1;i<v.length;i++){
    let d=v[i]-v[i-1];
    ag=(ag*(p-1)+Math.max(d,0))/p;
    al=(al*(p-1)+Math.max(-d,0))/p;
  }
  return al===0?100:100-100/(1+ag/al);
}

function indicators(v){
  let e20=ema(v,20).at(-1);
  let e50=ema(v,50).at(-1);
  let f=ema(v,12),s=ema(v,26);
  let line=v.map((_,i)=>f[i]-s[i]);
  let sig=ema(line,9);
  let R=rsi(v);
  let M=line.at(-1)>sig.at(-1)?"BULLISH":"BEARISH";
  let E=e20>e50?"BULLISH":"BEARISH";
  let P=v.at(-1);
  let signal="NO TRADE";

  if(P>e20 && e20>e50 && R>50 && R<68 && M==="BULLISH")
    signal="LONG";

  if(P<e20 && e20<e50 && R<50 && R>32 && M==="BEARISH")
    signal="SHORT";

  return {signal,R,E,M};
}

async function getAnalysis(symbol,interval){
  let url=API+"/fapi/v1/klines?symbol="+symbol+
          "&interval="+interval+"&limit=100";
  let res=await fetch(url);
  if(!res.ok)throw Error("Kline error");
  let data=await res.json();
  let closes=data.map(x=>Number(x[4]));
  return indicators(closes);
}

async function analyzeCoin(t){
  let symbol=t.symbol;
  let [a,b,c]=await Promise.all([
    getAnalysis(symbol,"5m"),
    getAnalysis(symbol,"15m"),
    getAnalysis(symbol,"1h")
  ]);

  let signal="NO TRADE";
  if(a.signal==="LONG"&&b.signal==="LONG"&&c.signal==="LONG")
    signal="LONG";
  if(a.signal==="SHORT"&&b.signal==="SHORT"&&c.signal==="SHORT")
    signal="SHORT";

  let score=0;
  if(a.signal===signal&&signal!=="NO TRADE")score+=1;
  if(b.signal===signal&&signal!=="NO TRADE")score+=2;
  if(c.signal===signal&&signal!=="NO TRADE")score+=3;

  return {symbol,price:Number(t.lastPrice),volume:Number(t.quoteVolume),
          a,b,c,signal,score};
}

function price(n){
  return Number(n).toLocaleString("en-US",{maximumFractionDigits:6});
}

async function scanMarket(){
  const connection=document.getElementById("connection");
  const analysis=document.getElementById("analysis");
  const prices=document.getElementById("prices");
  const details=document.getElementById("details");

  try{
    connection.innerHTML="● CONNECTING — FULL MARKET SCAN";

    const [infoRes,tickerRes]=await Promise.all([
      fetch(API+"/fapi/v1/exchangeInfo"),
      fetch(API+"/fapi/v1/ticker/24hr")
    ]);

    if(!infoRes.ok||!tickerRes.ok)throw Error("Binance API error");

    const info=await infoRes.json();
    const tickers=await tickerRes.json();

    const allowed=new Set(info.symbols
      .filter(s=>s.status==="TRADING" &&
        s.contractType==="PERPETUAL" &&
        s.quoteAsset==="USDT")
      .map(s=>s.symbol));

    const market=tickers
      .filter(t=>allowed.has(t.symbol)&&Number(t.quoteVolume)>0)
      .sort((x,y)=>Number(y.quoteVolume)-Number(x.quoteVolume));

    const top=market.slice(0,10);

    prices.innerHTML=top.map(t=>`
      <tr>
        <td>${t.symbol}</td>
        <td>${price(t.lastPrice)}</td>
        <td>${Number(t.priceChangePercent).toFixed(2)}%</td>
      </tr>`).join("");

    connection.innerHTML=
      '<span class="good">● CONNECTED — FULL MARKET DATA</span>';

    analysis.innerHTML="<tr><td colspan='6'>Scanning top 20 by volume...</td></tr>";

    const candidates=market.slice(0,20);
    const results=await Promise.allSettled(
      candidates.map(t=>analyzeCoin(t))
    );

    const valid=results
      .filter(x=>x.status==="fulfilled")
      .map(x=>x.value);

    const setups=valid
      .filter(x=>x.signal!=="NO TRADE")
      .sort((x,y)=>y.score-x.score || y.volume-x.volume)
      .slice(0,5);

    if(setups.length===0){
      analysis.innerHTML=
        "<tr><td colspan='6'>NO TRADE — No fully aligned setup.</td></tr>";
      details.innerHTML=
        '<span class="wait">No suitable setup now. Waiting for the next scan.</span>';
    }else{
      analysis.innerHTML=setups.map(x=>`
        <tr>
          <td>${x.symbol}</td>
          <td>${x.score}/6</td>
          <td>${x.a.signal}</td>
          <td>${x.b.signal}</td>
          <td>${x.c.signal}</td>
          <td class="${x.signal==="LONG"?"good":"bad"}">${x.signal}</td>
        </tr>`).join("");

      details.innerHTML=setups.map(x=>`
        <p><b>${x.symbol}: <span class="${x.signal==="LONG"?"good":"bad"}">${x.signal}</span></b><br>
        Entry reference price: ${price(x.price)}<br>
        Alignment score: ${x.score}/6<br>
        24h quote volume: ${price(x.volume)} USDT<br>
        5m: ${x.a.signal} | 15m: ${x.b.signal} | 1h: ${x.c.signal}</p>
      `).join("");
    }

    document.getElementById("scanStatus").innerText=
      "Eligible pairs: "+allowed.size+
      " | Analyzed: "+valid.length+
      " | Last scan: "+new Date().toLocaleTimeString();

  }catch(e){
    connection.innerHTML=
      '<span class="bad">SCAN ERROR: '+e.message+'</span>';
    analysis.innerHTML="<tr><td colspan='6'>Scan failed. Try again later.</td></tr>";
  }
}

document.querySelector("#analysis").closest("table")
.querySelector("thead tr").innerHTML=
"<th>Coin</th><th>Score</th><th>5m</th><th>15m</th><th>1h</th><th>Signal</th>";

const status=document.createElement("p");
status.id="scanStatus";
status.className="small";
document.getElementById("analysis").closest(".card").appendChild(status);

scanMarket();
setInterval(scanMarket,60000);
</script>
